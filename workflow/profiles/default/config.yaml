executor: slurm
jobs: 100
latency-wait: 60
keep-going: True
reason: True
rerun-incomplete: True
printshellcmds: True
rerun-triggers: mtime
default-resources:
  runtime: 10m
  mem_mb_per_cpu: 2000
  max_jobs_per_timespan: 10s
  partition: epyc,rome,medium
set-resources:
  macse:
    mem_mb_per_cpu: 8000
    runtime: 1d
  recombination:
    mpi: "srun"
    nodes: 1
    tasks: 32
    runtime: 1d
  FEL_all_partitions:
  MEME_all_partitions:
  BUSTEDS_MH_all_partitions:
  RELAX_all_partitions:
  